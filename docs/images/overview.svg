<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 730" width="1160" height="730" role="img" aria-labelledby="t d">
<title id="t">Elixcon Light Hub: what controls it and what it drives</title>
<desc id="d">The web page, a WLED stream, home apps over Matter, Zigbee remotes and wired switches control the hub; the WLED stream is an alpha feature. It drives Zigbee lamps, plugs and relays; Matter lamps; and relays and LED strips wired to the board. Each room is one dimmable light.</desc>
