# Host tests and the web page's tests, and alongside them both firmware images
# from sdkconfig.defaults. Every run keeps the images as a workflow artifact; a v* tag
# also publishes them as a GitHub release. See docs/development.md.
name: firmware

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make -C test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y zopfli
      - run: npm ci
      - run: npm test
      - run: npm run check
      # The firmware embeds the committed main/www/index.html, never builds it, so
      # a UI change that was not rebuilt and committed would ship the old page.
      - name: The committed page is what web/ builds
        run: |
          npm run build
          git diff --stat --exit-code -- ../main/www/index.html || {
            echo "::error file=main/www/index.html::not what web/ builds - run npm run build in web/ and commit it"
            exit 1
          }

  # Alongside the tests rather than after them: release waits for all three.
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    env:
      # The image turns ccache on (IDF_CCACHE_ENABLE); kept between runs below.
      CCACHE_DIR: /tmp/ccache
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the tags: the firmware's version is git describe
      # The workspace belongs to the runner's user and the container runs as root;
      # without this git refuses the repository and the version becomes "1".
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: apt-get update && apt-get install -y zopfli
      # ccache keys on the preprocessed source, so the newest cache of any
      # commit is safe to start from.
      - uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-idf-v5.5.5-${{ github.sha }}
          restore-keys: ccache-idf-v5.5.5-
      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build
          tools/make-release.sh build dist
      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host-tests, web, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME"
          sed -e "s|@BASE@|$base|g" -e "s|@VERSION@|$GITHUB_REF_NAME|g" > notes.md <<'EOF'
          - `elixcon_light_hub-@VERSION@-factory.bin`: a blank board. It erases everything stored.
          - `elixcon_light_hub-@VERSION@-usb.zip`: a board already in use, over USB. It keeps everything stored.
          - `elixcon_light_hub-@VERSION@.bin`: an update over the network.
          - `elixcon_light_hub_updater-@VERSION@.bin`: converting an ESPHome device, or replacing the updater.
          - `elixcon_light_hub-@VERSION@.elf`: decodes a crash record from this build.

          How to write each one: [Installing](@BASE@/README.md#installing), [Firmware updates](@BASE@/docs/updates.md), [Converting](@BASE@/docs/converting.md), [After a crash](@BASE@/docs/development.md#after-a-crash).
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
             --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes
